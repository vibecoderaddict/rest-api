name: Main CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: main-cicd
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests and coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run go vet
        run: go vet ./...

      - name: Write CI summary
        if: always()
        run: |
          {
            echo "## Main Quality Gate"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Go tests, race detector, coverage, and vet ran before the image build."
          } >> "$GITHUB_STEP_SUMMARY"

  container:
    name: build-and-scan-image
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan image with Trivy
        id: trivy_image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_CONFIG_SCANNERS: misconfig,secret
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: trivy-image.json
          exit-code: '0'

      - name: Prepare image security report
        id: image_report
        if: always()
        run: |
          trivy_blockers=0
          if [[ -f trivy-image.json ]]; then
            trivy_blockers=$(jq '[
              .Results[]?.Vulnerabilities[]?
              | select(.Severity == "HIGH" or .Severity == "CRITICAL")
              | select((.FixedVersion // "") != "")
            ] + [
              .Results[]?.Misconfigurations[]?, .Results[]?.Secrets[]?
              | select(.Severity == "HIGH" or .Severity == "CRITICAL")
            ] | length' trivy-image.json 2>/dev/null || echo unavailable)
          fi
          trivy_findings=0
          [[ -f trivy-image.json ]] && trivy_findings=$(jq '[.Results[]?.Vulnerabilities[]?, .Results[]?.Misconfigurations[]?, .Results[]?.Secrets[]?] | length' trivy-image.json 2>/dev/null || echo unavailable)
          trivy_status="${{ steps.trivy_image.outcome }}"
          if [[ "$trivy_status" == "success" && "$trivy_blockers" != "0" ]]; then
            trivy_status=failure
          fi
          {
            echo "trivy_status=${trivy_status}"
            echo "trivy_findings=${trivy_findings}"
            echo "trivy_blockers=${trivy_blockers}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Trivy Image Findings"
            echo
            echo "- Total findings across all severities: ${trivy_findings}"
            echo "- Blocking findings: ${trivy_blockers}"
            echo
            echo "#### Vulnerabilities / CVEs"
            jq -r '
              [.Results[]?.Vulnerabilities[]?]
              | if length == 0 then "- None"
                else .[] | "- `\(.VulnerabilityID)` [\(.Severity)] \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "no fix")"
                end
            ' trivy-image.json 2>/dev/null || echo '- Unavailable'
            echo
            echo "#### Misconfigurations"
            jq -r '
              [.Results[]?.Misconfigurations[]?]
              | if length == 0 then "- None"
                else .[] | "- `\(.ID)` [\(.Severity)] \(.Title)"
                end
            ' trivy-image.json 2>/dev/null || echo '- Unavailable'
            echo
            echo "#### Secrets"
            jq -r '
              [.Results[]?.Secrets[]?]
              | if length == 0 then "- None"
                else .[] | "- `\(.RuleID // .Category)` [\(.Severity)] \(.Target // "unknown target")"
                end
            ' trivy-image.json 2>/dev/null || echo '- Unavailable'
          } > trivy-image-report.md

      - name: Enforce image security gate
        if: always()
        run: |
          if [[ "${{ steps.image_report.outputs.trivy_status }}" != "success" ]]; then
            exit 1
          fi

      - name: Push approved image
        run: docker push "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Write image summary
        if: always()
        run: |
          {
            echo "## Container Release"
            echo
            echo "- Image: ${IMAGE_NAME}:${GITHUB_SHA}"
            echo "- Trivy findings across all severities: ${{ steps.image_report.outputs.trivy_findings }}"
            echo "- Trivy blocking findings: ${{ steps.image_report.outputs.trivy_blockers }}"
            echo "- The image was pushed only after Go and Trivy HIGH/CRITICAL gates passed."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f trivy-image-report.md ]]; then
            cat trivy-image-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Trivy report was unavailable." >> "$GITHUB_STEP_SUMMARY"
          fi
