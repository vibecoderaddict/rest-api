name: Main CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: main-cicd
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests and coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run go vet
        run: go vet ./...

      - name: Check SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          test -n "$SONAR_TOKEN" || { echo "SONAR_TOKEN secret is required"; exit 1; }
          test -n "$SONAR_HOST_URL" || { echo "SONAR_HOST_URL repository secret is required"; exit 1; }

      - name: SonarQube scan and quality gate
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Write CI summary
        if: always()
        run: |
          {
            echo "## Main Quality Gate"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- SonarQube quality gate is enforced before the image build."
          } >> "$GITHUB_STEP_SUMMARY"

  container:
    name: build-and-scan-image
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false

      - name: Push approved image
        run: docker push "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Write image summary
        run: |
          {
            echo "## Container Release"
            echo
            echo "- Image: ${IMAGE_NAME}:${GITHUB_SHA}"
            echo "- The image was pushed only after Go, SonarQube, and Trivy gates passed."
          } >> "$GITHUB_STEP_SUMMARY"
